name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: port-killer
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: port-killer
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: port-killer
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: port-killer
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: port-killer.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross & cargo-deb (if Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-deb
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo install cross
          fi

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Build Debian Package (x86_64 Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo deb --no-build

      - name: Package Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../port-killer-${{ matrix.target }}.tar.gz ${{ matrix.bin_name }}
          cd ../../..
        shell: bash

      - name: Package Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../port-killer-${{ matrix.target }}.zip ${{ matrix.bin_name }}
          cd ../../..
        shell: bash

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            port-killer-${{ matrix.target }}.${{ matrix.archive_ext }}
            target/debian/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish NPM / Bun Package
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Publish to NPM
        run: |
          cd packages/npm
          bun publish --access public
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
